<mat-card>
  <mat-card-header>
    <mat-card-title>Directorio de Estudiantes</mat-card-title>
    <mat-card-subtitle>Total: {{ totalRecords }} Usuarios</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      
      <ng-container matColumnDef="user_id">
        <th mat-header-cell *matHeaderCellDef> ID / Teléfono </th>
        <td mat-cell *matCellDef="let element"> {{element.user_id}} </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Situación </th>
        <td mat-cell *matCellDef="let element"> 
          <mat-chip [color]="getStatusColor(element.status)">
            {{element.status || 'Nuevo'}}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="level">
        <th mat-header-cell *matHeaderCellDef> Nivel </th>
        <td mat-cell *matCellDef="let element"> {{element.level || '-'}} </td>
      </ng-container>

      <ng-container matColumnDef="step">
        <th mat-header-cell *matHeaderCellDef> Paso (Flujo) </th>
        <td mat-cell *matCellDef="let element"> {{element.step}} </td>
      </ng-container>

      <ng-container matColumnDef="messages">
        <th mat-header-cell *matHeaderCellDef> Mensajes </th>
        <td mat-cell *matCellDef="let element"> {{element.messages}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [length]="totalRecords"
                   [pageSize]="pageSize"
                   [pageSizeOptions]="[5, 10, 25, 100]"
                   (page)="onPageChange($event)">
    </mat-paginator>
  </mat-card-content>
</mat-card>
