<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="side" opened class="sidenav">
    <mat-toolbar color="primary" class="logo-toolbar">
      <img src="https://www.fcfm.uanl.mx/wp-content/uploads/2024/06/cropped-cropped-logo-fcfm.png"
          alt="FCFM Logo"
          class="fcfm-logo">
    </mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/chat" routerLinkActive="active">
        <mat-icon matListItemIcon>chat</mat-icon>
        <div matListItemTitle>Chatbot</div>
      </a>
      <a mat-list-item routerLink="/admin" routerLinkActive="active">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <div matListItemTitle>Dashboard</div>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span>{{title}}</span>
    </mat-toolbar>
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
