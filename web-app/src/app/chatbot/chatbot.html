<mat-card class="chat-card">
  <mat-card-header>
    <mat-card-title>Asistente FCFM</mat-card-title>
    <mat-card-subtitle>Resuelve tus dudas de ingreso, materias o titulación</mat-card-subtitle>
  </mat-card-header>
  
  <mat-card-content class="chat-messages" #scrollMe [scrollTop]="scrollMe.scrollHeight">
    <div *ngFor="let msg of messages" class="message-row" [ngClass]="{'user-row': msg.sender === 'user', 'bot-row': msg.sender === 'bot'}">
      <div class="message-bubble" [ngClass]="msg.sender">
        <span class="message-text">{{msg.text}}</span>
      </div>
    </div>
    <div *ngIf="isLoading" class="message-row bot-row">
      <div class="message-bubble bot">
        <mat-spinner diameter="20"></mat-spinner>
      </div>
    </div>
  </mat-card-content>

  <mat-card-actions class="chat-input-area">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Escribe un mensaje...</mat-label>
      <input matInput [(ngModel)]="newMessage" (keyup.enter)="sendMessage()">
      <button matSuffix mat-icon-button color="primary" (click)="sendMessage()" [disabled]="!newMessage.trim() || isLoading">
        <mat-icon>send</mat-icon>
      </button>
    </mat-form-field>
  </mat-card-actions>
</mat-card>
